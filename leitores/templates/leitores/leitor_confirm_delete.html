{% extends 'base.html' %}

{% block titulo %}Excluir leitor — Leitores{% endblock %}

{% block conteudo %}
<div class="cabecalho-pagina">
    <h1>Excluir leitor</h1>
</div>

<div class="aviso-perigo">
    <p>Tem certeza de que deseja excluir o leitor <strong>{{ leitor.nome }}</strong>?</p>
    <p>Esta ação não pode ser desfeita.</p>
</div>

<form method="post" class="acoes" data-confirmar="Confirma a exclusão? Esta ação não pode ser desfeita.">
    {% csrf_token %}
    <button class="botao botao-perigo" type="submit">Sim, excluir</button>
    <a class="botao botao-neutro" href="{% url 'leitores:leitor_detalhar' leitor.pk %}">Cancelar</a>
</form>
{% endblock %}
