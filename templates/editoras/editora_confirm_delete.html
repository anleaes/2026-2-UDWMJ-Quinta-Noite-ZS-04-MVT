{% extends 'base.html' %}

{% block title %}Excluir editora — Editoras{% endblock %}

{% block body %}
<div class="cabecalho-pagina">
    <h1>Excluir editora</h1>
</div>

<div class="aviso-perigo">
    <p>Tem certeza de que deseja excluir a editora <strong>{{ editora.nome }}</strong>?</p>
    <p>Esta ação não pode ser desfeita.</p>
</div>

<form method="post" class="acoes" data-confirmar="Confirma a exclusão? Esta ação não pode ser desfeita.">
    {% csrf_token %}
    <button class="botao botao-perigo" type="submit">Sim, excluir</button>
    <a class="botao botao-neutro" href="{% url 'editoras:editora_detalhar' editora.pk %}">Cancelar</a>
</form>
{% endblock %}
