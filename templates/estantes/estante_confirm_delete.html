{% extends 'base.html' %}

{% block title %}Excluir estante — Estantes{% endblock %}

{% block body %}
<div class="cabecalho-pagina">
    <h1>Excluir estante</h1>
</div>

<div class="aviso-perigo">
    <p>Tem certeza de que deseja excluir a estante <strong>{{ estante }}</strong>?</p>
    <p>Esta ação não pode ser desfeita.</p>
</div>

<form method="post" class="acoes" data-confirmar="Confirma a exclusão? Esta ação não pode ser desfeita.">
    {% csrf_token %}
    <button class="botao botao-perigo" type="submit">Sim, excluir</button>
    <a class="botao botao-neutro" href="{% url 'estantes:estante_detalhar' estante.pk %}">Cancelar</a>
</form>
{% endblock %}
