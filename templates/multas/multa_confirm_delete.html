{% extends 'base.html' %}

{% block title %}Excluir multa — Multas{% endblock %}

{% block body %}
<div class="cabecalho-pagina">
    <h1>Excluir multa</h1>
</div>

<div class="aviso-perigo">
    <p>Tem certeza de que deseja excluir a multa <strong>{{ multa }}</strong>?</p>
    <p>Esta ação não pode ser desfeita.</p>
</div>

<form method="post" class="acoes" data-confirmar="Confirma a exclusão? Esta ação não pode ser desfeita.">
    {% csrf_token %}
    <button class="botao botao-perigo" type="submit">Sim, excluir</button>
    <a class="botao botao-neutro" href="{% url 'multas:multa_detalhar' multa.pk %}">Cancelar</a>
</form>
{% endblock %}
